<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Learning Quest</title>
<meta name="theme-color" content="#0d1f2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Learning Quest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path id="logostar" fill="#ffc94d" stroke="#e0a21c" stroke-width="4" stroke-linejoin="round"/></svg><span><b>Learning Quest</b></span></div>
    <div class="chips">
      <span class="chip star" id="starChip" title="Discovery stars">⭐ <span id="starN">0</span></span>
      <span class="chip" title="Days in a row">🔥 <span id="dayN">0</span></span>
      <button class="chip kidchip" id="whoBtn" aria-label="Switch child">👤</button>
      <button class="chip" data-nav="home">🏠 Home</button>
      <button class="chip" data-nav="stk">🔬 Field Guide</button>
      <button class="chip" id="calmTop" aria-label="Calm Corner: breathing and calm tools">🫧</button>
      <button class="chip" id="soundBtn" aria-label="Sound on or off">🔊</button>
      <button class="chip" id="calmBtn" aria-label="Calm mode: fewer moving things">🌙 Calm</button>
      <button class="chip" data-nav="par">Parent</button>
    </div>
  </header>
  <main>
    <section id="v-who" hidden></section>
    <section id="v-home"></section>
    <section id="v-world" hidden></section>
    <section id="v-play" hidden>
      <div class="playhead">
        <button class="x" id="quit" aria-label="Back to home">✕</button>
        <div class="track"><div class="fill" id="fill"></div><div class="rk" id="rk">🔎</div></div>
        <div class="count" id="count"></div>
      </div>
      <div class="card">
        <div class="prompt"><h2 id="prompt"></h2><button class="say" id="sayBtn" aria-label="Read it to me">🔊</button></div>
        <div class="stage" id="stage"></div>
        <p class="hint" id="hint" aria-live="polite"></p>
        <div class="actions" id="actions"></div>
        <div id="fb" hidden></div>
      </div>
    </section>
    <section id="v-result" hidden></section>
    <section id="v-stk" hidden></section>
    <section id="v-par" hidden></section>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>
<script src="words-data.js?v=12"></script>
<script src="social-data.js?v=12"></script>
<script src="social-k2.js?v=12"></script>
<script src="lang-data.js?v=12"></script>
<script src="lang-data-45.js?v=12"></script>
<script src="discover-data.js?v=12"></script>
<script src="expert-data.js?v=1"></script>
<script src="ef-data.js?v=12"></script>
<script src="math-lab.js?v=12"></script>
<script src="curriculum.js?v=12"></script>
<script src="math-more.js?v=12"></script>
<script src="daily.js?v=12"></script>
<script src="en.js?v=12"></script>
<script src="app.js?v=13"></script>
<script src="family.js?v=13"></script>
<script src="phase2.js?v=12"></script>
<script src="rewards.js?v=13"></script>
<script src="expert.js?v=1"></script>
</body>
</html>
