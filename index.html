<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stella's Science Quest</title>
<meta name="theme-color" content="#0d1f2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Science Quest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;700;800&display=swap">
<style>
:root{
  color-scheme:dark;
  --sky:#0d1f2d; --sky2:#173a4a; --panel:#1b4254; --panel2:#235268; --deep:#12303e; --line:#3a7389;
  --ink:#fff8ea; --muted:#b5d3dc; --gold:#ffc94d; --gold2:#ffe39a; --goldDeep:#e0a21c;
  --mint:#5ee3b1; --coral:#ff8f8f; --dark:#10222c;
  --noun:#6cc6ff; --verb:#ffa25c; --adj:#f59ae0; --adv:#a6e36b;
  --display:'Baloo 2',ui-rounded,'Arial Rounded MT Bold',system-ui,sans-serif;
  --read:'Andika','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
}
html,body{height:100%;margin:0}
body{background-color:var(--sky);background-image:radial-gradient(120% 70% at 50% 0%,var(--sky2),var(--sky) 72%);background-attachment:fixed;color:var(--ink);font-family:var(--read);font-size:18px;line-height:1.5;touch-action:manipulation;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold2);outline-offset:3px;border-radius:10px}
[hidden]{display:none!important}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky i{position:absolute;border-radius:50%;background:#fff;opacity:.45;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}
.app{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left));padding-top:calc(10px + env(safe-area-inset-top));padding-bottom:calc(48px + env(safe-area-inset-bottom))}
h1,h2,h3,.disp{font-family:var(--display);line-height:1.15;text-wrap:balance;margin:0}

.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:6px 14px}
.logo{display:flex;align-items:center;gap:8px;margin-right:auto;font-family:var(--display);font-weight:800;font-size:1.45rem}
.logo svg{width:34px;height:34px}
.logo b{color:var(--gold)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums;min-height:40px}
.chip.star{color:var(--gold2)}
.chip.on{background:var(--gold2);color:var(--dark);border-color:var(--gold)}
.chip.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.2)}}

.mapgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:20px;align-items:start}
@media (max-width:760px){.mapgrid{grid-template-columns:1fr}}
.side{display:flex;flex-direction:column;gap:16px}
.today{background:linear-gradient(160deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:24px;padding:20px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.eyebrow{font-family:var(--display);font-weight:700;font-size:.85rem;letter-spacing:1.5px;text-transform:uppercase;color:var(--gold)}
.today h2{font-size:2rem}
.today p{margin:0;color:var(--muted)}
.today p b{color:var(--ink)}
.hello{display:flex;gap:12px;align-items:center}
.nova{width:64px;height:64px;flex:none}
.big{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--display);font-weight:800;font-size:1.3rem;background:var(--gold);color:#3a2600;border-radius:18px;padding:12px 26px;box-shadow:0 5px 0 var(--goldDeep);transition:transform .08s;min-height:56px}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 var(--goldDeep)}
.big:disabled{opacity:.45;cursor:default}
.ghost{font-family:var(--display);font-weight:700;border:2px solid var(--line);border-radius:16px;padding:10px 18px;background:var(--panel);min-height:48px}
.rank{background:var(--panel);border-radius:20px;padding:14px 18px;display:flex;flex-direction:column;gap:8px}
.rank .row{display:flex;justify-content:space-between;gap:8px;font-family:var(--display);font-weight:700}
.bar{height:14px;background:var(--deep);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));border-radius:99px;transition:width .6s}
.fact{font-size:.98rem;color:var(--muted);margin:0}
.fact b{color:var(--gold2)}
.steps{display:flex;gap:6px;flex-wrap:wrap}
.steps span{background:var(--deep);border-radius:99px;padding:2px 10px;font-size:.9rem;color:var(--muted)}

.trail{width:100%;max-width:460px;display:block;margin:0 auto}
.trail .ln{stroke:var(--line);stroke-width:4;stroke-dasharray:2 10;stroke-linecap:round;fill:none}
.trail .ln.lit{stroke:var(--gold);stroke-dasharray:none;stroke-width:4}
.node{cursor:pointer}
.node .bub{fill:var(--panel);stroke:var(--line);stroke-width:3;transition:transform .2s;transform-box:fill-box;transform-origin:center}
.node.done .bub{fill:#2e6b58;stroke:var(--mint)}
.node.next .bub{fill:var(--panel2);stroke:var(--gold);stroke-width:4}
.node .emo{font-size:24px;text-anchor:middle;pointer-events:none}
.node.locked .emo{opacity:.3}
.node .halo{fill:none;stroke:var(--gold2);stroke-width:3;opacity:0}
.node.next .halo{animation:halo 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{0%{opacity:.9;transform:scale(.7)}100%{opacity:0;transform:scale(1.5)}}
.node .lbl{font-family:var(--display);font-weight:700;font-size:14px;fill:var(--ink);text-anchor:middle}
.node.locked .lbl{fill:#7fa4b1}
.node .ck{fill:var(--mint)} .node .ckt{font-size:12px;font-weight:800;text-anchor:middle;fill:var(--dark);font-family:var(--display)}
.node:hover .bub{transform:scale(1.08)}
.node:focus{outline:none}
.node:focus-visible .bub{stroke:#fff}

.overlay{position:fixed;inset:0;background:rgba(5,15,22,.65);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px}
.sheet{width:100%;max-width:540px;background:linear-gradient(170deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:26px;padding:22px;display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out;margin-bottom:env(safe-area-inset-bottom)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h2{font-size:1.8rem}
.sheet p{margin:0}
.tip{background:var(--deep);border-radius:16px;padding:12px 14px;font-size:1.05rem}
.tip b{color:var(--gold2)}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.mini-stars{color:var(--gold);letter-spacing:2px;font-size:1.2rem}

.playhead{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{width:48px;height:48px;border-radius:14px;background:var(--panel);border:2px solid var(--line);font-size:1.2rem;flex:none}
.track{position:relative;flex:1;height:18px;background:var(--deep);border-radius:99px}
.track .fill{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mint),var(--gold));border-radius:99px;transition:width .4s}
.track .rk{position:absolute;top:50%;transform:translate(-50%,-55%);font-size:26px;transition:left .4s;line-height:1}
.count{font-family:var(--display);font-weight:800;min-width:70px;text-align:right;font-size:1.1rem;font-variant-numeric:tabular-nums}
.count small{display:block;color:var(--verb);font-size:.9rem;line-height:1}
.card{background:linear-gradient(170deg,var(--panel2),var(--panel));border:2px solid var(--line);border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:16px;box-shadow:0 12px 34px rgba(0,0,0,.25)}
.prompt{display:flex;align-items:center;gap:12px}
.prompt h2{font-size:1.6rem;flex:1}
.say{width:52px;height:52px;border-radius:50%;background:var(--deep);border:2px solid var(--line);font-size:1.3rem;flex:none}
.n{color:var(--noun)} .v{color:var(--verb)} .a{color:var(--adj)} .d{color:var(--adv)}
.stage{min-height:170px;display:flex;flex-direction:column;gap:16px;justify-content:center}
.cloud{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;padding-block:10px}
.tok{font-family:var(--read);font-weight:700;font-size:1.5rem;padding:10px 20px;border-radius:999px;background:#245a70;border:3px solid #3f86a0;transition:transform .12s,background .12s;min-height:52px}
.cloud .tok{border-radius:40% 55% 45% 60%/55% 45% 60% 45%;padding:14px 24px}
.tok.sel{background:var(--gold2);color:#3a2600;border-color:var(--gold)}
.tok.ok,.tok.fixed{background:var(--mint);color:#063a2a;border-color:#2fbf8b}
.tok.ok u{text-decoration-thickness:3px}
.tok.no{background:var(--coral);color:#4a0d0d;border-color:#e86060;text-decoration:line-through}
.tok.miss{border-style:dashed;border-color:var(--mint);animation:pulse 1s ease-in-out 3}
.tok.shake{animation:shake .4s}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sentence{display:flex;flex-wrap:wrap;gap:8px 6px;justify-content:center;align-items:center}
.sentence .tok{font-size:1.45rem;padding:6px 12px;border-radius:14px}
.sentence .p{font-weight:700;font-size:1.6rem;margin-left:-4px}
.blank{display:inline-block;min-width:48px;height:52px;border:3px dashed var(--gold2);border-radius:12px;text-align:center;font-size:1.8rem;line-height:44px;font-weight:700;vertical-align:middle}
.stage.locked .tok,.stage.locked .bin,.stage.locked .pm,.stage.locked .blank{pointer-events:none}
.word{align-self:center;font-weight:700;font-size:2.8rem;background:var(--deep);border:3px solid var(--line);border-radius:26px;padding:10px 38px;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.bin{border-radius:22px;padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--dark);transition:transform .1s;min-height:84px}
.bin b{font-family:var(--display);font-size:1.5rem;font-weight:800}
.bin small{font-size:.95rem;opacity:.85}
.bin.n{background:var(--noun)} .bin.v{background:var(--verb)} .bin.a{background:var(--adj)} .bin.d{background:var(--adv)}
.bin.picked-no{outline:4px solid var(--coral);outline-offset:3px;opacity:.7}
.bin.picked-ok{outline:4px solid #fff;outline-offset:3px}
.pms{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.pm{width:104px;padding:10px 0 12px;border-radius:22px;background:var(--deep);border:3px solid var(--line);display:flex;flex-direction:column;align-items:center}
.pm b{font-size:2.6rem;line-height:1}
.pm small{font-family:var(--display);font-weight:700;color:var(--muted)}
.opts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;align-items:center}
.opts .lead{width:100%;text-align:center;color:var(--muted);font-family:var(--display);font-weight:700}
.opt{font-weight:700;font-size:1.4rem;padding:8px 22px;border-radius:14px;background:var(--gold2);color:#3a2600;border:3px solid var(--gold);min-height:52px}
.hint{min-height:1.5em;text-align:center;color:var(--gold2);font-size:1.1rem;margin:0}
.actions{display:flex;justify-content:center}
.fb{display:flex;gap:14px;align-items:flex-start;border-radius:22px;padding:16px;animation:up .25s ease-out}
.fb.good{background:#1d5446;border:2px solid var(--mint)}
.fb.bad{background:#51303d;border:2px solid var(--coral)}
.fb .body{flex:1;display:flex;flex-direction:column;gap:6px}
.fb h3{font-size:1.5rem}
.fb ul{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px}
.fb .sci{background:rgba(0,0,0,.2);border-radius:12px;padding:6px 10px;font-size:1rem}
.fb .go{align-self:center}
@media (max-width:560px){.fb{flex-wrap:wrap}.fb .go{width:100%}.prompt h2{font-size:1.3rem}.word{font-size:2.2rem}.tok{font-size:1.3rem}}

.result{text-align:center;align-items:center}
.bigstars{display:flex;gap:10px;justify-content:center}
.bigstars svg{width:78px;height:78px}
.bigstars .on{animation:pop .5s backwards}
@keyframes pop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25)}}
.spec{display:flex;gap:14px;align-items:center;background:var(--deep);border:2px solid var(--line);border-radius:20px;padding:14px 18px;text-align:left;max-width:540px}
.spec .e{font-size:3.2rem;line-height:1}
.extra{background:var(--deep);border:2px dashed var(--line);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:8px;max-width:540px;width:100%}
.extra.bonus{border-color:var(--gold)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.stk{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:6px}
.stk .e{font-size:3rem;line-height:1.1}
.stk.lock .e{filter:grayscale(1) brightness(.35)}
.stk .nm{font-family:var(--display);font-weight:700;font-size:1.15rem;line-height:1.2}
.stk p{margin:0;font-size:.98rem;color:var(--muted)}

.parent{font-family:system-ui,-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;font-size:16px;display:flex;flex-direction:column;gap:18px}
.parent section{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}
.parent h2{font-size:1.5rem;margin-bottom:8px}
.parent h3{font-size:1.15rem;margin:14px 0 6px}
.parent p,.parent li{color:#eaf4f7;max-width:72ch}
.parent ul{padding-left:1.2em;margin:6px 0}
.tbl{overflow-x:auto}
.parent table{border-collapse:collapse;width:100%;min-width:560px;font-size:15px}
.parent th,.parent td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.parent th{color:var(--gold2)}
.tag{display:inline-block;border-radius:99px;padding:1px 10px;font-size:13px;font-weight:700}
.tag.good{background:#1d5446;color:var(--mint)} .tag.warn{background:#51303d;color:var(--coral)}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchips span{background:var(--deep);border-radius:99px;padding:2px 10px;font-size:14px}
.parent textarea{width:100%;min-height:80px;background:var(--deep);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px;font:13px ui-monospace,monospace}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="sky" aria-hidden="true"></div>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="app">
  <header class="top">
    <div class="logo"><svg viewBox="0 0 100 100" aria-hidden="true"><path id="logostar" fill="#ffc94d" stroke="#e0a21c" stroke-width="4" stroke-linejoin="round"/></svg><span>Stella's <b>Science</b> Quest</span></div>
    <div class="chips">
      <span class="chip star" id="starChip" title="Discovery stars">⭐ <span id="starN">0</span></span>
      <span class="chip" title="Days in a row">🔥 <span id="dayN">0</span></span>
      <button class="chip" id="soundBtn" aria-label="Sound on or off">🔊</button>
      <button class="chip" id="calmBtn" aria-label="Calm mode: fewer moving things">🌙 Calm</button>
      <button class="chip" id="navMap">🗺️ Map</button>
      <button class="chip" id="navStk">🔬 Field Guide</button>
      <button class="chip" id="navPar">家长</button>
    </div>
  </header>
  <main>
    <section id="v-map"></section>
    <section id="v-play" hidden>
      <div class="playhead">
        <button class="x" id="quit" aria-label="Back to map">✕</button>
        <div class="track"><div class="fill" id="fill"></div><div class="rk" id="rk">🔎</div></div>
        <div class="count" id="count"></div>
      </div>
      <div class="card">
        <div class="prompt"><h2 id="prompt"></h2><button class="say" id="sayBtn" aria-label="Read it to me">🔊</button></div>
        <div class="stage" id="stage"></div>
        <p class="hint" id="hint" aria-live="polite"></p>
        <div class="actions" id="actions"></div>
        <div id="fb" hidden></div>
      </div>
    </section>
    <section id="v-result" hidden></section>
    <section id="v-stk" hidden></section>
    <section id="v-par" hidden></section>
  </main>
</div>
<div class="overlay" id="overlay" hidden></div>

<script>
/* ================= CONTENT =================
   Built from Stella's worksheets (Sept 2026): nouns, verbs, adjectives, -ly adverbs,
   end punctuation, proofreading. Words and sentences use nature and science topics. */
const NOUNS=['tree','butterfly','flower','hair','grass','bus','volcano','fossil','planet','octopus','crystal','magnet','comet','seed','root','cloud','lava','shark','beetle','moon','glacier','dinosaur','Jupiter','Mars','rainbow','egg','feather','leaf','rock','ocean','tadpole','cactus','bee','frog','owl','soil','water','sand','Earth','lily','family','belly','Stella'];
const ADJS=['green','slippery','bumpy','soft','furry','fluffy','tiny','huge','hot','frozen','shiny','slimy','rocky','fuzzy','spiky','gooey','bright','rough','smooth','heavy','sticky','salty','wet','prickly','colorful','icy','brave','cheerful','friendly'];
const VERBS=['erupt','hatch','grow','melt','orbit','dig','swim','bloom','freeze','sting','crawl','glow','spin','hunt','fly','roar','jump','climb','kick','push'];
const ADVS=['slowly','quickly','gently','quietly','loudly','safely','carefully','brightly','softly','suddenly','bravely','eagerly','happily','neatly','silently'];
const LY_TRAPS=['fly','lily','family','belly','butterfly','friendly'];
const TRICKY_N=['hair','grass','water','soil','lava','sand'];
const CONCRETE=['tree','butterfly','flower','bus','fossil','crystal','octopus','beetle','feather','cactus','rock','comet'];
const NO_CLOUD=['Stella','lily','family','belly','bus'];
const PROPER=['Jupiter','Mars','Earth','Stella','Mia','Ava'];
const WORDTAG={};NOUNS.forEach(w=>WORDTAG[w]='n');ADJS.forEach(w=>WORDTAG[w]='a');VERBS.forEach(w=>WORDTAG[w]='v');ADVS.forEach(w=>WORDTAG[w]='d');
const TAGNAME={n:'noun',v:'verb',a:'adjective',d:'adverb'};
const TAGTEST={n:'the ___',a:'the ___ rock',v:'I can ___',d:'It moved ___'};

const SENTS=[
 "The hot/a lava/n flowed/v down the volcano/n .",
 "A tiny/a seed/n grows/v into a tall/a tree/n .",
 "The shiny/a comet/n zoomed/v past the sun/n .",
 "Busy/a bees/n collect/v sweet/a nectar/n .",
 "The spiky/a cactus/n stores/v water/n .",
 "A green/a caterpillar/n munched/v a leaf/n .",
 "Penguins/n slide/v on the icy/a snow/n .",
 "The fuzzy/a bee/n buzzed/v loudly/d .",
 "The scientist/n carefully/d dug/v up the old/a fossil/n .",
 "Bats/n hunt/v at night/n .",
 "The bright/a moon/n orbits/v Earth/n .",
 "The huge/a whale/n sang/v a long/a song/n .",
 "Stella/n found/v a sparkly/a crystal/n .",
 "The slimy/a frog/n caught/v a fly/n .",
 "Do sharks/n sleep/v ?",
 "The brave/a girl/n climbed/v a rocky/a mountain/n ."
];
// Adverb + verb pairs. The first three come from her "Find the -ly Adverbs" worksheet.
const ADV_SENTS=[
 "Mia quietly/d read/v her library book .",
 "Ava gently/d placed/v the seed in the soil .",
 "The puppy happily/d chased/v its ball .",
 "The owl silently/d flew/v over the field .",
 "The lava slowly/d crept/v down the hill .",
 "The cheetah quickly/d chased/v the gazelle .",
 "The scientist carefully/d dug/v up the fossil .",
 "The frog loudly/d croaked/v at night .",
 "Snow softly/d fell/v on the pine trees .",
 "The baby turtle safely/d reached/v the ocean .",
 "The volcano suddenly/d erupted/v !",
 "Fireflies brightly/d glowed/v in the dark ."
];
const PUNCT=[
 ["Do volcanoes erupt every day","?"],["A spider has eight legs","."],["Wow, look at that shooting star","!"],
 ["Why is the sky blue","?"],["The Moon goes around Earth","."],["Watch out, that jellyfish stings","!"],
 ["How many legs does an insect have","?"],["Frogs lay their eggs in water","."],["Hooray, the chicks hatched","!"],
 ["Is Jupiter bigger than Earth","?"],["Bees make honey","."],["Ouch, the cactus poked me","!"],
 ["What do pandas eat","?"],["Plants need sunlight to grow","."],["Yay, I found a fossil","!"],
 ["Where do penguins live","?"],["It rained on Wednesday","."],["Do you like vegetables","?"]

const take=(arr,n,not=[])=>shuffle(arr.filter(x=>!not.includes(x))).slice(0,n);

const tagSpan=t=>`<span class="${t}">${TAGNAME[t]}</span>`;
const parseS=s=>s.split(' ').map(x=>{const [w,t]=x.split('/');return{w,tag:t||''}});
const plain=s=>s.replace(/\/\w/g,'').replace(/\|/g,'').replace(/ _$/,'').replace(/ ([.?!,])/g,'$1');

function confetti(n=80){
  if(S.calm||matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffc94d','#ffe39a','#6cc6ff','#f59ae0','#5ee3b1','#a6e36b'];
  const ps=times(n,()=>({x:c.width/2+(Math.random()-.5)*200,y:c.height*.45,vx:(Math.random()-.5)*14,vy:-Math.random()*14-4,r:Math.random()*6+5,c:cols[rnd(6)],a:Math.random()*6,va:(Math.random()-.5)*.3}));
  let f=0;(function step(){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.vy+=.45;p.x+=p.vx;p.y+=p.vy;p.a+=p.va;x.save();x.translate(p.x,p.y);x.rotate(p.a);x.fillStyle=p.c;x.beginPath();for(let i=0;i<10;i++){const an=-Math.PI/2+i*Math.PI/5,q=i%2?p.r*.45:p.r;x.lineTo(q*Math.cos(an),q*Math.sin(an))}x.fill();x.restore()});if(++f<110)requestAnimationFrame(step);else x.clearRect(0,0,c.width,c.height)})();
}

/* ================= ROUND BUILDERS ================= */
function cloud(t){
  const k=2+rnd(3);let tg,dis;
  if(t==='n'){const tr=take(TRICKY_N,1);tg=tr.concat(take(NOUNS,k-1,tr.concat(NO_CLOUD)));dis=take(ADJS.concat(VERBS),6-k)}
  else{tg=take(ADJS,k,['friendly']);const nn=take(CONCRETE,Math.min(2,6-k));dis=nn.concat(take(VERBS,6-k-nn.length))}
  return{type:'select',layout:'cloud',target:t,tokens:shuffle(tg.concat(dis)).map(w=>({w,tag:WORDTAG[w]}))};
}
function sentIdx(t,n){return shuffle(SENTS.map((_,i)=>i).filter(i=>SENTS[i].includes('/'+t))).slice(0,n)}
function sentR(i,t){return{type:'select',layout:'sentence',target:t,idx:i,tokens:parseS(SENTS[i])}}
function sortR(w,bins=['n','v','a','d']){return{type:'sort',w,tag:WORDTAG[w],bins}}
function punctR(i){return{type:'punct',idx:i}}
function proofR(i){return{type:'proof',idx:i}}
function pairR(i){return{type:'pair',idx:i}}
function buildTwin(){const tr=take(['tree','butterfly','flower','bus','hair','grass'],3);return shuffle(tr.concat(take(ADJS,2,['friendly']))).map(w=>sortR(w,['n','a'])).concat([sentR(sentIdx('a',1)[0],'a')])}
function buildAdv(){const ids=shuffle(ADV_SENTS.map((_,i)=>i).filter(i=>i>0)).slice(0,3);return[pairR(0)].concat(ids.map(pairR),take(LY_TRAPS,2,['friendly']).map(w=>sortR(w,['d','n','v'])))}
function sort4Words(){const tr=take(['tree','butterfly','flower','hair','grass'],1);return shuffle(tr.concat(take(ADJS,1),take(VERBS,1,['fly']),take(ADVS,2),take(LY_TRAPS,1,tr)))}
function fromKey(k){const p=k.split(':');
  if(p[0]==='w')return WORDTAG[p[1]]?sortR(p[1]):null;
  if(p[0]==='s')return SENTS[+p[1]]?sentR(+p[1],p[2]):null;
  if(p[0]==='p')return PUNCT[+p[1]]?punctR(+p[1]):null;
  if(p[0]==='f')return PROOF[+p[1]]?proofR(+p[1]):null;
  if(p[0]==='q')return ADV_SENTS[+p[1]]?pairR(+p[1]):null;return null}
function buildOops(){
  const keys=Object.entries(S.mistakes).sort((a,b)=>b[1]-a[1]).map(e=>e[0]).slice(0,8);
  const r=keys.map(fromKey).filter(Boolean);
  const have=keys.filter(k=>k.startsWith('w:')).map(k=>k.slice(2));
  take(['tree','butterfly','flower','hair','grass','soft','fly','lily','slowly','bumpy'],Math.max(0,6-r.length),have).forEach(w=>r.push(sortR(w)));
  return shuffle(r);
}
function buildBoss(){return shuffle([cloud('n'),cloud('a'),sentR(sentIdx('v',1)[0],'v'),sentR(sentIdx('a',1)[0],'a'),pairR(rnd(ADV_SENTS.length))]
  .concat(sort4Words().slice(0,2).map(w=>sortR(w)),shuffle(PUNCT.map((_,i)=>i)).slice(0,2).map(punctR),[proofR(rnd(PROOF.length))]))}

function explain(t,layout){
  const w=esc(t.w),ly=/ly$/.test(t.w)&&t.tag!=='d'?` It ends in -ly, but it is <b>not</b> an adverb!`:'';
  if(t.tag==='n')return(PROPER.includes(t.w)?`<b>${w}</b> is a ${tagSpan('n')}. It is a name.`:`<b>${w}</b> is a ${tagSpan('n')}, a thing you can see or touch. Try: "the ${esc(t.w.toLowerCase())}" ✓`)+ly;
  if(t.tag==='a')return`<b>${w}</b> is an ${tagSpan('a')}. It describes. Try: "the ${w} rock" ✓`+ly;
  if(t.tag==='v')return(layout==='sentence'?`<b>${w}</b> is the ${tagSpan('v')}. It is the action in this sentence.`:`<b>${w}</b> is a ${tagSpan('v')}, an action. Try: "I can ${w}" ✓`)+ly;
  if(t.tag==='d')return`<b>${w}</b> is an ${tagSpan('d')}. It tells HOW. Try: "It moved ${w}" ✓`;
  return`<b>${w}</b> is a small helper word.`;
}

let R=null;
function startMission(id){const m=MISSIONS[id-1];R={m,rounds:m.build(),i:0,errs:0,good:0,combo:0,best:0};$('#rk').textContent=m.icon;show('play');renderRound()}
function setProgress(){const p=R.i/R.rounds.length*100;$('#fill').style.width=p+'%';$('#rk').style.left=Math.max(3,Math.min(97,p))+'%';
  $('#count').innerHTML=`${R.i+1} / ${R.rounds.length}${R.combo>=3?`<small>🔥 ×${R.combo}</small>`:''}`}
function renderRound(){
  const r=R.rounds[R.i];R.cur={r,err:false,done:false};setProgress();
  const st=$('#stage');st.innerHTML='';st.className='stage';$('#hint').textContent='';$('#actions').innerHTML='';$('#fb').hidden=true;$('#fb').innerHTML='';
  ({select:rSelect,sort:rSort,punct:rPunct,proof:rProof,pair:rPair})[r.type](r,st);
}
function setPrompt(html,say){$('#prompt').innerHTML=html;$('#sayBtn').onclick=()=>speak(say)}
function shake(b){b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake')}

function rSelect(r,st){
  const n=r.tokens.filter(t=>t.tag===r.target).length;
  const sentence=r.layout==='sentence';
  setPrompt(n===1&&sentence?`Tap the ${tagSpan(r.target)} in the sentence.`:`Tap ALL the ${tagSpan(r.target)}s${sentence?' in the sentence':''}. Then tap Check.`,
    sentence?plain(SENTS[r.idx]):`Tap all the ${TAGNAME[r.target]}s. Then tap Check.`);
  const box=document.createElement('div');box.className=sentence?'sentence':'cloud';
  const sel=new Set(),btns=[];
  r.tokens.forEach((t,i)=>{
    if(isP(t.w)){const s=document.createElement('span');s.className='p';s.textContent=t.w;box.appendChild(s);return}
    const b=document.createElement('button');b.className='tok';b.textContent=t.w;
    if(!sentence)b.style.transform=`rotate(${(Math.random()*8-4).toFixed(1)}deg)`;
    b.onclick=()=>{if(sel.has(i)){sel.delete(i);b.classList.remove('sel')}else{sel.add(i);b.classList.add('sel');if(!sentence)speak(t.w)}SFX.tap();chk.disabled=!sel.size};
    btns[i]=b;box.appendChild(b)});
  st.appendChild(box);
  const chk=document.createElement('button');chk.className='big';chk.textContent='Check ✓';chk.disabled=true;$('#actions').appendChild(chk);
  chk.onclick=()=>{
    $('#actions').innerHTML='';st.classList.add('locked');const wrong=[],missed=[];
    r.tokens.forEach((t,i)=>{if(!btns[i])return;const isT=t.tag===r.target,s=sel.has(i);btns[i].classList.remove('sel');
      if(s&&isT){btns[i].classList.add('ok');if(!sentence)clearMistake('w:'+t.w)}
      else if(s){btns[i].classList.add('no');wrong.push(t)}
      else if(isT){btns[i].classList.add('miss');missed.push(t)}});
    const ok=!wrong.length&&!missed.length;
    if(!sentence)wrong.concat(missed).forEach(t=>{if(WORDTAG[t.w])addMistake('w:'+t.w)});
    else ok?clearMistake(`s:${r.idx}:${r.target}`):addMistake(`s:${r.idx}:${r.target}`);
    const lines=wrong.map(t=>explain(t,r.layout)).concat(missed.map(t=>'You missed one: '+explain(t,r.layout))).slice(0,3);
    finish(ok,lines,factFor(shuffle(r.tokens.map(t=>t.w))));
  };
}
function rSort(r,st){
  setPrompt(r.bins.length>2?'What kind of word is it?':`Is it a ${r.bins.map(tagSpan).join(' or ')}?`,r.w);
  const w=document.createElement('div');w.className='word';w.textContent=r.w;st.appendChild(w);
  const bins=document.createElement('div');bins.className='bins';
  r.bins.forEach(t=>{const b=document.createElement('button');b.className='bin '+t;b.innerHTML=`<b>${TAGNAME[t][0].toUpperCase()+TAGNAME[t].slice(1)}</b><small>${TAGTEST[t].replace('___',esc(r.w))}</small>`;
    b.onclick=()=>{st.classList.add('locked');const ok=t===r.tag;b.classList.add(ok?'picked-ok':'picked-no');ok?clearMistake('w:'+r.w):addMistake('w:'+r.w);
      finish(ok,ok&&!/ly$/.test(r.w)?[]:[explain({w:r.w,tag:r.tag},'cloud')],factFor([r.w]))};bins.appendChild(b)});
  st.appendChild(bins);setTimeout(()=>speak(r.w),150);
}
const PWHY={'.':'It tells something, so it ends with a period.','?':'It asks something, so it ends with a question mark.','!':'It shows a strong feeling, so it ends with an exclamation mark!'};
function rPunct(r,st){
  const [s,ans]=PUNCT[r.idx];setPrompt('Which mark goes at the end?',s);
  const line=document.createElement('div');line.className='sentence';
  s.split(' ').forEach(w=>{const sp=document.createElement('span');sp.className='tok';sp.style.pointerEvents='none';sp.textContent=w;line.appendChild(sp)});
  const bl=document.createElement('span');bl.className='blank';bl.textContent=' ';line.appendChild(bl);st.appendChild(line);
  const pms=document.createElement('div');pms.className='pms';
  [['.','tells'],['?','asks'],['!','wow!']].forEach(([m,l])=>{const b=document.createElement('button');b.className='pm';b.innerHTML=`<b>${m}</b><small>${l}</small>`;b.setAttribute('aria-label',{'.':'period','?':'question mark','!':'exclamation mark'}[m]);
    b.onclick=()=>{st.classList.add('locked');bl.textContent=m;const ok=m===ans;bl.style.borderColor=ok?'var(--mint)':'var(--coral)';ok?clearMistake('p:'+r.idx):addMistake('p:'+r.idx);
      finish(ok,ok?[]:[`The answer is <b>${ans}</b>. ${PWHY[ans]}`])};pms.appendChild(b)});
  st.appendChild(pms);
}
function rProof(r,st){
  const [src,fix,opts,hint]=PROOF[r.idx];
  const toks=src.split(' ').map(x=>{const bad=/^\|.*\|$/.test(x);return{w:bad?x.slice(1,-1):x,bad}});
  setPrompt('There is 1 mistake. Tap it. 🔍',plain(src));
  const line=document.createElement('div');line.className='sentence';st.appendChild(line);
  const optBox=document.createElement('div');optBox.className='opts';st.appendChild(optBox);
  let tries=0;
  toks.forEach(t=>{
    const b=document.createElement('button');
    if(t.w==='_'){b.className='blank';b.textContent=' ';b.setAttribute('aria-label','end of the sentence')}else{b.className='tok';b.textContent=t.w}
    b.onclick=()=>{
      if(R.cur.done)return;
      if(!t.bad){R.cur.err=true;tries++;shake(b);SFX.bad();$('#hint').textContent=tries>=2?'💡 '+hint:'That part is correct. Look at the other words and the end.';return}
      SFX.tap();optBox.innerHTML='<div class="lead">How should it be?</div>';
      shuffle(opts).forEach(o=>{const ob=document.createElement('button');ob.className='opt';ob.textContent=o;
        ob.onclick=()=>{if(o===fix){R.cur.done=true;b.textContent=fix;b.className='tok fixed';optBox.innerHTML='';st.classList.add('locked');
            R.cur.err?addMistake('f:'+r.idx):clearMistake('f:'+r.idx);finish(!R.cur.err,R.cur.err?['💡 '+hint]:[])}
          else{R.cur.err=true;ob.disabled=true;ob.style.opacity=.35;SFX.bad();$('#hint').textContent='💡 '+hint}};
        optBox.appendChild(ob)})};
    line.appendChild(b)});
}
// Two steps: tap the WHOLE -ly adverb, then the verb it describes (her worksheet asked for both).
function rPair(r,st){
  const toks=parseS(ADV_SENTS[r.idx]),say=plain(ADV_SENTS[r.idx]);let step=1,adv='';
  const setP=()=>setPrompt(step===1?`Step 1 of 2: Tap the whole ${tagSpan('d')}.`:`Step 2 of 2: <b class="d">${adv}</b> tells HOW. Tap the ${tagSpan('v')} it tells about.`,say);
  setP();
  const line=document.createElement('div');line.className='sentence';st.appendChild(line);
  toks.forEach(t=>{
    if(isP(t.w)){const s=document.createElement('span');s.className='p';s.textContent=t.w;line.appendChild(s);return}
    const b=document.createElement('button');b.className='tok';b.textContent=t.w;
    b.onclick=()=>{
      if(R.cur.done)return;
      const want=step===1?'d':'v';
      if(t.tag===want){
        if(step===1){adv=t.w;b.className='tok ok';b.innerHTML=esc(t.w.slice(0,-2))+'<u>ly</u>';SFX.tap();$('#hint').innerHTML=`Yes! The <b>whole word</b> "${esc(t.w)}" is the adverb, not only "ly".`;step=2;setP()}
        else{R.cur.done=true;b.className='tok fixed';st.classList.add('locked');R.cur.err?addMistake('q:'+r.idx):clearMistake('q:'+r.idx);
          finish(!R.cur.err,[`<b class="d">${esc(adv)}</b> tells HOW it <b class="v">${esc(t.w)}</b>. The adverb and the verb go together.`])}
      }else{R.cur.err=true;shake(b);SFX.bad();
        $('#hint').textContent=step===1?`"${t.w}" is not the adverb. Find the word that ends in -ly and tells HOW.`:`"${t.w}" is not the action. What did it do ${adv}?`}
    };
    line.appendChild(b)});
}
function finish(ok,lines,fact){
  if(ok){R.good++;R.combo++;R.best=Math.max(R.best,R.combo);S.stars++;SFX.good();refreshChips(true)}else{R.errs++;R.combo=0;SFX.bad()}
  save();setProgress();
  let msg=ok?pickOne(CHEERS):pickOne(OOPS);
  if(ok&&R.combo===3)msg='3 in a row! 🔥';if(ok&&R.combo===5){msg='5 in a row! 💥';confetti(50)}
  const last=R.i===R.rounds.length-1,fb=$('#fb');
  fb.className='fb '+(ok?'good':'bad');fb.hidden=false;
  fb.innerHTML=`${novaSVG(ok?'':'oops')}<div class="body"><h3>${msg}${ok?' <span style="color:var(--gold2)">+1 ⭐</span>':''}</h3>${lines.length?'<ul>'+lines.map(l=>'<li>'+l+'</li>').join('')+'</ul>':''}${fact?`<div class="sci">🔬 Science fact: ${esc(fact)}</div>`:''}</div><button class="big go" id="nextBtn">${last?'Finish 🏁':'Next ➜'}</button>`;
  $('#hint').textContent='';
  $('#nextBtn').onclick=()=>{R.i++;R.i>=R.rounds.length?endMission():renderRound()};
  fb.scrollIntoView({behavior:S.calm?'auto':'smooth',block:'nearest'});
}
function endMission(){
  const m=R.m,id=m.id,total=R.rounds.length,stars=R.errs<=1?3:R.errs<=3?2:1,first=!S.done[id];

   ${first?`<div class="spec"><span class="e">${m.spec[0]}</span><div><div class="eyebrow">New Field Guide card!</div><div class="disp" style="font-size:1.35rem">${m.spec[1]}</div><div>${m.spec[2]}</div></div></div>`:''}
   ${stars<3?`<p class="fact">Play again to get 3 stars.</p>`:''}
   <div class="extra"><div class="eyebrow">Brain break (optional)</div><div style="font-size:1.15rem">${brk}</div><div><button class="ghost" id="brkBtn">Start 20 seconds</button></div></div>
   ${m.bonus&&!S.bonus[id]?`<div class="extra bonus" id="bonusBox"><div class="eyebrow">Bonus field mission · with a grown-up</div><div>${m.bonus}</div><div><button class="ghost" id="bonusBtn">We did it! +3 ⭐</button></div></div>`:''}
   <div class="btnrow" style="justify-content:center"><button class="big" id="rsMap">Back to the map 🗺️</button><button class="ghost" id="rsAgain">Play again</button></div></div>`;
  show('result');SFX.win();confetti(stars===3?140:80);
  $('#rsMap').onclick=()=>show('map');$('#rsAgain').onclick=()=>startMission(id);

  const bb=$('#bonusBtn');if(bb)bb.onclick=()=>{S.bonus[id]=dayStr();S.stars+=3;save();refreshChips(true);SFX.win();$('#bonusBox').innerHTML='<div class="disp" style="font-size:1.2rem">Bonus done! +3 ⭐</div>'};
}

   <h3>重置</h3>
   <div class="btnrow" id="resetRow"><button class="ghost" id="resetBtn">清除所有进度</button></div></section></div>`;
  $('#bkCopy').onclick=()=>{const t=$('#bkOut');t.select();(navigator.clipboard?navigator.clipboard.writeText(t.value):Promise.reject()).then(()=>{$('#bkCopy').textContent='已复制 ✓'},()=>{try{document.execCommand('copy');$('#bkCopy').textContent='已复制 ✓'}catch(e){}})};
  $('#bkLoad').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#bkIn').value.trim()))));if(!o||o.v!==2)throw 0;S=Object.assign(fresh(),o);save();refreshChips();renderParent();$('#bkMsg').textContent='已恢复 ✓'}catch(e){$('#bkMsg').textContent='备份码不对，请重新复制完整的备份码。'}};
  $('#resetBtn').onclick=()=>{$('#resetRow').innerHTML='<span>确定清除所有星星和进度？</span><button class="ghost" id="rsYes" style="border-color:var(--coral)">确定清除</button><button class="ghost" id="rsNo">取消</button>';
    $('#rsYes').onclick=()=>{S=fresh();save();refreshChips();renderParent()};$('#rsNo').onclick=renderParent};
}

(function sky(){const s=$('#sky');for(let i=0;i<60;i++){const d=document.createElement('i');const z=Math.random()*2.2+.8;d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}px;height:${z}px;animation-delay:${(Math.random()*3).toFixed(2)}s`;s.appendChild(d)}})();
$('#navMap').onclick=()=>show('map');$('#navStk').onclick=()=>show('stk');$('#navPar').onclick=()=>show('par');
$('#soundBtn').onclick=()=>{S.sound=!S.sound;save();refreshChips()};
$('#calmBtn').onclick=()=>{S.calm=!S.calm;save();refreshChips()};
$('#quit').onclick=()=>show('map');
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#overlay').hidden)closeSheet()});
if(window.speechSynthesis)try{speechSynthesis.getVoices()}catch(e){}
show('map');
</script>
