name: iOS release to TestFlight
# Run by hand from the Actions tab. See docs/APP_STORE.md for the four secrets it needs.
on:
  workflow_dispatch:
jobs:
  release:
    runs-on: macos-latest
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node tools/bank-check.js
      - run: npm run sync:ios
      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
      - name: Archive
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release
          -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" archive
          -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"
      - name: Upload to App Store Connect
        run: >
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive"
          -exportOptionsPlist ios/ExportOptions.plist -exportPath "$RUNNER_TEMP/export"
          -allowProvisioningUpdates
          -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
